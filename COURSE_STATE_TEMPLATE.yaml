schema: obsidian-course-state/v1
course_code: COURSE_CODE
course_name: ""
standard_version: "3.1"
status: active

structure:
  # unit_scheme is the ONLY variable in the delivery naming system (standard 2.4).
  # It decides the unit-directory prefix; every other naming segment derives from it.
  # Closed enum: week | lecture | module | chapter | unit | custom
  # Locked once the course has delivered its first unit.
  unit_scheme: week
  # Only used when unit_scheme is `custom`. Record the reason in course_overrides.
  unit_prefix: ""
  current_unit: 0

gold_reference:
  note: ""
  visual_baseline: ""

completed: []
# Example after first delivery:
# completed:
#   - unit: Week01
#     status: draft
#     artifacts:
#       - type: lecture
#         file: "Week01/Lecture 01 - Topic.md"
#         status: draft
#       - type: tutorial
#         file: "Week01/Tutorial 01 - Topic.md"
#         status: draft
#
# When the user accepts one artifact, update only that artifact.
# Set the unit to accepted only when all currently required artifacts are accepted.

course_overrides: []

next_expected:
  unit: Week01
  expected_types:
    - lecture

last_delivery:
  package: ""
  date: ""
